name: USBLocation
options:
  bundleIdPrefix: io.github.lelenotlikeus
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  # Icon Composer packages must be treated as a single file, not exploded.
  fileTypes:
    icon:
      file: true
settings:
  base:
    # Set your Apple Developer Team ID to build from source (see README).
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  USBLocation:
    type: application
    platform: iOS
    sources:
      - path: USBLocation
        excludes:
          - "**/Info.plist"
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
      - path: Vendor/idevice/LICENSE.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lelenotlikeus.usblocation
        PRODUCT_NAME: USBLocation
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: USBLocation/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: USBLocation/Resources/USBLocation.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
  USBLocationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SessionTests.swift
      - path: Tests/SessionDoubles.swift
      - path: USBLocation/Engine/GeoMotion.swift
      - path: USBLocation/Engine/SpoofSession.swift
      - path: USBLocation/Engine/RouteBuilder.swift
      - path: USBLocation/Engine/DeviceTunnel.swift
      - path: USBLocation/Support/SavedPlace.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lelenotlikeus.usblocation.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  USBLocation:
    build:
      targets:
        USBLocation: all
  MobileTests:
    build:
      targets:
        USBLocationTests: [test]
    test:
      targets:
        - USBLocationTests
